all:
  children:
    web_servers:
      hosts:
        web-1:
          ansible_host: 10.148.0.6
        web-2:
          ansible_host: 10.148.0.7

    database_nodes:
      hosts:
        db-node-1:
          ansible_host: 10.148.0.2
          mongo_role: primary
        db-node-2:
          ansible_host: 10.148.0.4
          mongo_role: secondary
        db-node-3:
          ansible_host: 10.148.0.5
          mongo_role: secondary

  vars:
    ansible_user: ubuntu
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    mongodb_version: "8.0"
