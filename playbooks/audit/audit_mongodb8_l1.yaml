---
- name: "Audit CIS MongoDB 8 Benchmark Level 1"
  hosts: database_nodes
  become: yes
  gather_facts: yes
  vars:
    audit_phase: "before"
    audit_remote_dir: "/tmp/cis_mongodb8_l1"
    audit_local_dir: "reports/{{ audit_phase }}"
    mongo_audit_user: ""
    mongo_audit_pass: ""
    mongo_audit_auth_db: "admin"
    mongo_audit_tls: "false"
    mongo_audit_tls_ca_file: "/etc/ssl/mongodb/mongoCA.crt"
    mongo_audit_tls_cert_key_file: "/etc/ssl/mongodb/{{ inventory_hostname }}.pem"
    mongo_audit_tls_allow_invalid_hostnames: "false"
    audit_package_files:
      - run_mongodb8_l1_audit.py
      - audit_software.py
      - audit_authentication.py
      - audit_authorization.py
      - audit_data_encryption.py
      - audit_system_activity.py
      - audit_network_configuration.py
      - audit_file_permissions.py

  tasks:
    - name: "Create local report directory"
      file:
        path: "{{ audit_local_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: no
      run_once: yes

    - name: "Create remote audit directory"
      file:
        path: "{{ audit_remote_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Copy CIS MongoDB 8 Level 1 audit package"
      copy:
        src: "../../audit/{{ item }}"
        dest: "{{ audit_remote_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop: "{{ audit_package_files }}"

    - name: "Run CIS MongoDB 8 Level 1 audit"
      command:
        argv:
          - python3
          - "{{ audit_remote_dir }}/run_mongodb8_l1_audit.py"
          - "--output"
          - "{{ audit_remote_dir }}/{{ inventory_hostname }}.json"
          - "--markdown"
          - "{{ audit_remote_dir }}/{{ inventory_hostname }}.md"
          - "--sections-dir"
          - "{{ audit_remote_dir }}/sections"
      environment:
        MONGO_AUDIT_HOST: "{{ ansible_host if (mongo_audit_tls | bool) else '127.0.0.1' }}"
        MONGO_AUDIT_USER: "{{ mongo_audit_user }}"
        MONGO_AUDIT_PASS: "{{ mongo_audit_pass }}"
        MONGO_AUDIT_AUTH_DB: "{{ mongo_audit_auth_db }}"
        MONGO_AUDIT_TLS: "{{ mongo_audit_tls }}"
        MONGO_AUDIT_TLS_CA_FILE: "{{ mongo_audit_tls_ca_file }}"
        MONGO_AUDIT_TLS_CERT_KEY_FILE: "{{ mongo_audit_tls_cert_key_file }}"
        MONGO_AUDIT_TLS_ALLOW_INVALID_HOSTNAMES: "{{ mongo_audit_tls_allow_invalid_hostnames }}"
      register: cis_audit
      changed_when: false
      failed_when: false

    - name: "Show audit summary"
      debug:
        msg: "{{ inventory_hostname }} audit completed with rc={{ cis_audit.rc }}"

    - name: "Fetch JSON report"
      fetch:
        src: "{{ audit_remote_dir }}/{{ inventory_hostname }}.json"
        dest: "{{ audit_local_dir }}/{{ inventory_hostname }}.json"
        flat: yes

    - name: "Fetch Markdown report"
      fetch:
        src: "{{ audit_remote_dir }}/{{ inventory_hostname }}.md"
        dest: "{{ audit_local_dir }}/{{ inventory_hostname }}.md"
        flat: yes
