---
- name: "Audit CIS MongoDB 8 Level 1 by section"
  hosts: database_nodes
  become: yes
  gather_facts: yes
  vars:
    audit_phase: "before"
    audit_remote_dir: "/tmp/cis_mongodb8_sections"
    audit_local_dir: "reports/{{ audit_phase }}/sections"
    mongo_audit_user: ""
    mongo_audit_pass: ""
    mongo_audit_auth_db: "admin"
    mongo_audit_allowed_admin_users: ""
    mongo_audit_tls: "false"
    mongo_audit_tls_ca_file: "/etc/ssl/mongodb/mongoCA.crt"
    mongo_audit_tls_cert_key_file: "/etc/ssl/mongodb/{{ inventory_hostname }}.pem"
    mongo_audit_tls_allow_invalid_hostnames: "false"
    audit_sections:
      - name: "01-software"
        script: "audit_software.py"
      - name: "02-authentication"
        script: "audit_authentication.py"
      - name: "03-authorization"
        script: "audit_authorization.py"
      - name: "04-data-encryption"
        script: "audit_data_encryption.py"
      - name: "05-system-activity"
        script: "audit_system_activity.py"
      - name: "06-network-configuration"
        script: "audit_network_configuration.py"
      - name: "07-file-permissions"
        script: "audit_file_permissions.py"

  tasks:
    - name: "Create local section report directory"
      file:
        path: "{{ audit_local_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: no

    - name: "Create remote audit directory"
      file:
        path: "{{ audit_remote_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Copy section audit scripts"
      copy:
        src: "../../audit/{{ item.script }}"
        dest: "{{ audit_remote_dir }}/{{ item.script }}"
        owner: root
        group: root
        mode: "0755"
      loop: "{{ audit_sections }}"

    - name: "Run section audit scripts"
      command:
        argv:
          - python3
          - "{{ audit_remote_dir }}/{{ item.script }}"
          - "--output"
          - "{{ audit_remote_dir }}/{{ inventory_hostname }}-{{ item.name }}.json"
      environment:
        MONGO_AUDIT_HOST: "{{ ansible_host if (mongo_audit_tls | bool) else '127.0.0.1' }}"
        MONGO_AUDIT_USER: "{{ mongo_audit_user }}"
        MONGO_AUDIT_PASS: "{{ mongo_audit_pass }}"
        MONGO_AUDIT_AUTH_DB: "{{ mongo_audit_auth_db }}"
        MONGO_AUDIT_ALLOWED_ADMIN_USERS: "{{ mongo_audit_allowed_admin_users }}"
        MONGO_AUDIT_TLS: "{{ mongo_audit_tls }}"
        MONGO_AUDIT_TLS_CA_FILE: "{{ mongo_audit_tls_ca_file }}"
        MONGO_AUDIT_TLS_CERT_KEY_FILE: "{{ mongo_audit_tls_cert_key_file }}"
        MONGO_AUDIT_TLS_ALLOW_INVALID_HOSTNAMES: "{{ mongo_audit_tls_allow_invalid_hostnames }}"
      register: section_audit
      changed_when: false
      failed_when: false
      loop: "{{ audit_sections }}"

    - name: "Show section audit summary"
      debug:
        msg: "{{ inventory_hostname }} {{ item.item.name }} completed with rc={{ item.rc }}"
      loop: "{{ section_audit.results }}"

    - name: "Fetch section reports"
      fetch:
        src: "{{ audit_remote_dir }}/{{ inventory_hostname }}-{{ item.name }}.json"
        dest: "{{ audit_local_dir }}/{{ inventory_hostname }}/{{ item.name }}.json"
        flat: yes
      loop: "{{ audit_sections }}"
