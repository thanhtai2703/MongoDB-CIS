---
# =========================================================================
# CIS MongoDB 8 Remediation — Authentication
# Covers strictly per PDF Level 1:
#   2.1 (authorization: enabled) — 4 steps from PDF Remediation
#   2.2 (enableLocalhostAuthBypass: false)
#   7.1 (keyfile file permissions)
#
# Note: Play 1 below (install keyfile) is NOT a CIS 2.1 step.
# PDF 2.1 prescribes only 4 steps (start / create admin / set authorization / restart).
# Keyfile install is a MongoDB technical requirement for replica set deployment:
# "security.keyFile is required when authorization is enabled with replication".
# Operational necessity beyond CIS L1 scope. CIS audit only checks keyfile
# permissions (control 7.1), not the keyfile creation step itself.
# =========================================================================

- name: "[Deployment prerequisite — a CIS 2.1 step] Install replica set keyfile"
  hosts: database_nodes
  become: yes
  gather_facts: no
  tags: ["replica_set_prereq", "cis_7_1"]
  vars:
    mongodb_keyfile_path: "/etc/mongodb-keyfile"
    mongodb_keyfile_local_path: "/tmp/automation_cis_mongodb_keyfile"

  tasks:
    - name: "Generate shared replica set keyfile content on control node"
      set_fact:
        mongodb_keyfile_content: "{{ lookup('password', mongodb_keyfile_local_path ~ ' chars=ascii_letters,digits length=756') }}"
      delegate_to: localhost
      become: no
      run_once: yes

    - name: "Install shared replica set keyfile "
      copy:
        content: "{{ hostvars[groups['database_nodes'][0]].mongodb_keyfile_content }}"
        dest: "{{ mongodb_keyfile_path }}"
        owner: mongodb
        group: mongodb
        mode: "0600"

# =========================================================================
# CIS 2.1 — Step 2: Create the system user administrator
# =========================================================================
- name: "[CIS 2.1] Create MongoDB system user administrator"
  hosts: db-node-1
  become: yes
  gather_facts: no
  tags: ["cis_2_1"]
  vars:
    mongo_admin_user: "MongoAdmin"
    mongo_admin_pass: "AdminPass123!"
    mongo_auth_db: "admin"
    mongo_seed_uri: "mongodb://{{ hostvars['db-node-1'].ansible_host }}:{{ mongodb_port }}/?directConnection=true&w=majority"

  tasks:
    - name: "Wait for MongoDB primary to accept connections"
      shell: >
        mongosh --quiet
        "{{ mongo_seed_uri }}"
        --eval "db.hello().isWritablePrimary"
        | tail -n1
      register: primary_check
      until: primary_check.stdout | trim == 'true'
      retries: 12
      delay: 5
      changed_when: false

    # PDF CIS 2.1 Remediation step 2: Create the system user administrator
    - name: "Create or update system user administrator"
      shell: |
        mongosh --quiet "{{ mongo_seed_uri }}" <<'MONGO'
        const adb = db.getSiblingDB("{{ mongo_auth_db }}");

        if (adb.getUser("{{ mongo_admin_user }}")) {
          adb.updateUser("{{ mongo_admin_user }}", {
            pwd: "{{ mongo_admin_pass }}",
            roles: [{ role: "root", db: "admin" }]
          });
          print("updated user: {{ mongo_admin_user }}");
        } else {
          adb.createUser({
            user: "{{ mongo_admin_user }}",
            pwd: "{{ mongo_admin_pass }}",
            roles: [{ role: "root", db: "admin" }]
          });
          print("created user: {{ mongo_admin_user }}");
        }
        MONGO
      register: user_create
      changed_when: "'created user:' in user_create.stdout or 'updated user:' in user_create.stdout"
      no_log: true

# =========================================================================
# CIS 2.1 — Step 3+4: Set authorization: enabled + restart
# CIS 2.2       : Set setParameter.enableLocalhostAuthBypass: false
# =========================================================================
- name: "[CIS 2.1 + 2.2] Enable authorization and localhost bypass protection"
  hosts: database_nodes
  become: yes
  gather_facts: no
  tags: ["cis_2_1", "cis_2_2"]
  vars:
    mongodb_keyfile_path: "/etc/mongodb-keyfile"
  tasks:
    - name: "Render mongod_auth.conf.j2 (sets authorization=enabled, enableLocalhostAuthBypass=false)"
      template:
        src: ../../templates/mongod_auth.conf.j2
        dest: /etc/mongod.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart MongoDB

    - name: "Apply MongoDB auth config restart"
      meta: flush_handlers

    - name: "Wait for MongoDB port after auth remediation"
      wait_for:
        host: "{{ ansible_host }}"
        port: "{{ mongodb_port }}"
        timeout: 60

  handlers:
    - name: Restart MongoDB
      service:
        name: mongod
        state: restarted
