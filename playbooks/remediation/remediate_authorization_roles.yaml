---
# =========================================================================
# CIS MongoDB 8 Remediation — Authorization
# Covers:
#   3.1 (least privilege) — via prevention (no risky-role user created)
#   3.2 (RBAC configured) — assign built-in scoped roles to app users
#   3.4 (role review)     — revokePrivilegesFromRole on unneeded custom roles
# =========================================================================
- name: "[CIS 3.1 + 3.2 + 3.4] Remediate authorization roles"
  hosts: db-node-1
  become: yes
  gather_facts: no
  tags: ["cis_3_1", "cis_3_2", "cis_3_4"]
  vars:
    mongo_admin_user: "MongoAdmin"
    mongo_admin_pass: "AdminPass123!"
    mongo_auth_db: "admin"
    mongo_port: "{{ mongodb_port | default(27017) }}"
    mongo_audit_tls: "false"
    mongo_audit_tls_ca_file: "/etc/ssl/mongodb/mongoCA.crt"
    mongo_audit_tls_cert_key_file: "/etc/ssl/mongodb/{{ inventory_hostname }}.pem"
    mongo_audit_tls_allow_invalid_hostnames: "false"
    replace_demo_custom_roles: true
    dangerous_custom_role_names: []

  tasks:
    - name: "Auto-detect whether mongod is configured for TLS"
      shell: "grep -qE '^[[:space:]]*mode:[[:space:]]*requireTLS' /etc/mongod.conf && echo true || echo false"
      register: mongod_tls_detect
      changed_when: false

    - name: "Resolve effective TLS mode (mongod.conf is the source of truth)"
      set_fact:
        mongo_audit_tls_effective: "{{ mongod_tls_detect.stdout | trim }}"
        mongo_audit_tls_allow_invalid_hostnames_effective: "true"

    - name: "Show resolved TLS mode for connection"
      debug:
        msg: "mongod reports TLS={{ mongo_audit_tls_effective }} -> connecting with TLS={{ mongo_audit_tls_effective }}"

    - name: "Build MongoDB connection arguments"
      set_fact:
        mongo_connection_args: >-
          --host {{ ansible_host if (mongo_audit_tls_effective | bool) else '127.0.0.1' }}
          --port {{ mongo_port }}
          {% if mongo_audit_tls_effective | bool -%}
          --tls
          --tlsCAFile {{ mongo_audit_tls_ca_file }}
          --tlsCertificateKeyFile {{ mongo_audit_tls_cert_key_file }}
          --tlsAllowInvalidHostnames
          {%- endif %}

    - name: "Wait until this node is the writable primary"
      shell: >-
        mongosh --quiet {{ mongo_connection_args }}
        --username "{{ mongo_admin_user }}"
        --password "{{ mongo_admin_pass }}"
        --authenticationDatabase "{{ mongo_auth_db }}"
        --eval "db.hello().isWritablePrimary"
        | tail -n1
      register: primary_check
      until: primary_check.stdout | trim == 'true'
      retries: 24
      delay: 5
      changed_when: false

    # === CIS 3.2 — Assign appropriate built-in roles to application users ===
    # PDF Remediation: Establish roles, assign appropriate privileges, assign users.
    - name: "[CIS 3.2] Replace app users custom role with built-in scoped roles"
      tags: ["cis_3_2"]
      shell: |
        mongosh --quiet {{ mongo_connection_args }} \
          --username "{{ mongo_admin_user }}" \
          --password "{{ mongo_admin_pass }}" \
          --authenticationDatabase "{{ mongo_auth_db }}" <<'MONGO'
        const adb = db.getSiblingDB("admin");

        function updateIfExists(username, roles) {
          if (adb.getUser(username)) {
            adb.updateUser(username, { roles: roles });
            print("updated app user: " + username);
          }
        }

        updateIfExists("app_reader", [
          { role: "read", db: "demo" }
        ]);

        updateIfExists("app_writer", [
          { role: "readWrite", db: "demo" }
        ]);

        updateIfExists("app_admin", [
          { role: "readWrite", db: "demo" },
          { role: "dbAdmin", db: "demo" }
        ]);
        MONGO
      register: rbac_app_users
      changed_when: "'updated app user:' in rbac_app_users.stdout"
      no_log: false
      when: replace_demo_custom_roles | bool

    # === CIS 3.4 — Revoke unnecessary privileges from custom roles ===
    # PDF Remediation (strict): "To revoke specified privileges from the user-defined
    # role on the database where the command is run. The revokePrivilegesFromRole
    # command has the following syntax: ..."
    - name: "[CIS 3.4] Revoke privileges from unneeded custom roles (PDF revokePrivilegesFromRole)"
      tags: ["cis_3_4"]
      shell: |
        mongosh --quiet {{ mongo_connection_args }} \
          --username "{{ mongo_admin_user }}" \
          --password "{{ mongo_admin_pass }}" \
          --authenticationDatabase "{{ mongo_auth_db }}" <<'MONGO'
        const adb = db.getSiblingDB("admin");

        ["demoReader", "demoWriter", "demoAdmin"].forEach(function(roleName) {
          const role = adb.getRole(roleName, { showPrivileges: true });
          if (!role) {
            print("role absent: " + roleName);
            return;
          }

          const privileges = role.privileges || [];
          if (privileges.length > 0) {
            adb.runCommand({
              revokePrivilegesFromRole: roleName,
              privileges: privileges
            });
            print("revoked " + privileges.length + " privileges from role: " + roleName);
          } else {
            print("no privileges to revoke for role: " + roleName);
          }
        });
        MONGO
      register: role_privilege_revoke
      changed_when: "'revoked' in role_privilege_revoke.stdout"
      no_log: false
      when: replace_demo_custom_roles | bool

    - name: "[CIS 3.4] Drop explicitly listed dangerous custom roles (optional, user-supplied list)"
      tags: ["cis_3_4"]
      shell: |
        mongosh --quiet {{ mongo_connection_args }} \
          --username "{{ mongo_admin_user }}" \
          --password "{{ mongo_admin_pass }}" \
          --authenticationDatabase "{{ mongo_auth_db }}" <<'MONGO'
        const roles = {{ dangerous_custom_role_names | to_json }};
        roles.forEach(function(item) {
          const roleDb = db.getSiblingDB(item.db || "admin");
          try {
            roleDb.dropRole(item.role);
            print("dropped custom role: " + (item.db || "admin") + "." + item.role);
          } catch (e) {
            print("custom role absent: " + (item.db || "admin") + "." + item.role);
          }
        });
        MONGO
      register: dangerous_role_drop
      changed_when: "'dropped custom role:' in dangerous_role_drop.stdout"
      no_log: false
      when: dangerous_custom_role_names | length > 0
