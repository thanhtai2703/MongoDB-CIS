---
# =========================================================================
# CIS MongoDB 8 Remediation — File Permissions
# Covers: 7.1 (keyfile mode 0600 owner mongodb) + 7.2 (dbPath mode 0770 owner mongodb)
# =========================================================================
- name: "[CIS 7.1 + 7.2] Remediate file permissions"
  hosts: database_nodes
  become: yes
  gather_facts: no
  tags: ["cis_7_1", "cis_7_2"]
  vars:
    mongodb_keyfile_path: "/etc/mongodb-keyfile"
    mongodb_db_path: "/var/lib/mongodb"

  tasks:
    - name: "[CIS 7.1] Ensure MongoDB keyFile has strict permissions (chmod 600, chown mongodb)"
      tags: ["cis_7_1"]
      file:
        path: "{{ mongodb_keyfile_path }}"
        owner: mongodb
        group: mongodb
        mode: "0600"
      when: mongodb_keyfile_path | length > 0

    - name: "[CIS 7.2] Ensure MongoDB dbPath directory owner is mongodb (chmod 770)"
      tags: ["cis_7_2"]
      file:
        path: "{{ mongodb_db_path }}"
        state: directory
        owner: mongodb
        group: mongodb
        mode: "0770"

    - name: "[CIS 7.2] Ensure MongoDB dbPath files are owned by mongodb (recursive)"
      tags: ["cis_7_2"]
      file:
        path: "{{ mongodb_db_path }}"
        owner: mongodb
        group: mongodb
        recurse: yes

    - name: "[CIS 7.2] Restore dbPath directory mode after recursive ownership"
      tags: ["cis_7_2"]
      file:
        path: "{{ mongodb_db_path }}"
        state: directory
        owner: mongodb
        group: mongodb
        mode: "0770"

    - name: "Restart MongoDB after permission remediation"
      service:
        name: mongod
        state: restarted

    - name: "Wait for MongoDB port after permission remediation"
      wait_for:
        host: "{{ ansible_host }}"
        port: "{{ mongodb_port }}"
        timeout: 60
