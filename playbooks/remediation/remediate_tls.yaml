---
- name: "Enable MongoDB TLS transport encryption"
  hosts: database_nodes
  become: yes
  gather_facts: no
  vars:
    mongodb_tls_dir: "/etc/ssl/mongodb"
    mongodb_tls_local_dir: "/tmp/automation_cis_mongodb_tls_{{ lookup('env', 'USER') | default('ansible', true) }}"
    mongodb_tls_days: 825
    mongodb_keyfile_path: "/etc/mongodb-keyfile"

  tasks:
    - name: "Create local TLS artifact directory"
      file:
        path: "{{ mongodb_tls_local_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: no
      run_once: yes

    - name: "Generate local MongoDB CA private key"
      command:
        argv:
          - openssl
          - genrsa
          - -out
          - "{{ mongodb_tls_local_dir }}/mongoCA.key"
          - "4096"
        creates: "{{ mongodb_tls_local_dir }}/mongoCA.key"
      delegate_to: localhost
      become: no
      run_once: yes

    - name: "Generate local MongoDB CA certificate"
      command:
        argv:
          - openssl
          - req
          - -x509
          - -new
          - -nodes
          - -key
          - "{{ mongodb_tls_local_dir }}/mongoCA.key"
          - -sha256
          - -days
          - "3650"
          - -subj
          - "/CN=Automation-CIS MongoDB CA"
          - -out
          - "{{ mongodb_tls_local_dir }}/mongoCA.crt"
        creates: "{{ mongodb_tls_local_dir }}/mongoCA.crt"
      delegate_to: localhost
      become: no
      run_once: yes

    - name: "Render OpenSSL node certificate configs"
      copy:
        dest: "{{ mongodb_tls_local_dir }}/{{ item }}.cnf"
        mode: "0600"
        content: |
          [ req ]
          default_bits = 4096
          prompt = no
          default_md = sha256
          distinguished_name = req_distinguished_name
          req_extensions = req_ext

          [ req_distinguished_name ]
          CN = {{ item }}

          [ req_ext ]
          subjectAltName = @alt_names

          [ alt_names ]
          DNS.1 = {{ item }}
          IP.1 = {{ hostvars[item].ansible_host }}
          IP.2 = 127.0.0.1
      loop: "{{ groups['database_nodes'] }}"
      delegate_to: localhost
      become: no
      run_once: yes

    - name: "Generate node private keys"
      command:
        argv:
          - openssl
          - genrsa
          - -out
          - "{{ mongodb_tls_local_dir }}/{{ item }}.key"
          - "4096"
        creates: "{{ mongodb_tls_local_dir }}/{{ item }}.key"
      loop: "{{ groups['database_nodes'] }}"
      delegate_to: localhost
      become: no
      run_once: yes

    - name: "Generate node certificate signing requests"
      command:
        argv:
          - openssl
          - req
          - -new
          - -key
          - "{{ mongodb_tls_local_dir }}/{{ item }}.key"
          - -out
          - "{{ mongodb_tls_local_dir }}/{{ item }}.csr"
          - -config
          - "{{ mongodb_tls_local_dir }}/{{ item }}.cnf"
        creates: "{{ mongodb_tls_local_dir }}/{{ item }}.csr"
      loop: "{{ groups['database_nodes'] }}"
      delegate_to: localhost
      become: no
      run_once: yes

    - name: "Sign node certificates with local CA"
      command:
        argv:
          - openssl
          - x509
          - -req
          - -in
          - "{{ mongodb_tls_local_dir }}/{{ item }}.csr"
          - -CA
          - "{{ mongodb_tls_local_dir }}/mongoCA.crt"
          - -CAkey
          - "{{ mongodb_tls_local_dir }}/mongoCA.key"
          - -CAcreateserial
          - -out
          - "{{ mongodb_tls_local_dir }}/{{ item }}.crt"
          - -days
          - "{{ mongodb_tls_days | string }}"
          - -sha256
          - -extensions
          - req_ext
          - -extfile
          - "{{ mongodb_tls_local_dir }}/{{ item }}.cnf"
        creates: "{{ mongodb_tls_local_dir }}/{{ item }}.crt"
      loop: "{{ groups['database_nodes'] }}"
      delegate_to: localhost
      become: no
      run_once: yes

    - name: "Build MongoDB PEM files from node key and certificate"
      shell: "cat {{ mongodb_tls_local_dir }}/{{ item }}.key {{ mongodb_tls_local_dir }}/{{ item }}.crt > {{ mongodb_tls_local_dir }}/{{ item }}.pem"
      args:
        creates: "{{ mongodb_tls_local_dir }}/{{ item }}.pem"
      loop: "{{ groups['database_nodes'] }}"
      delegate_to: localhost
      become: no
      run_once: yes

    - name: "Verify generated TLS artifacts exist on controller"
      stat:
        path: "{{ item }}"
      register: tls_artifacts
      loop:
        - "{{ mongodb_tls_local_dir }}/mongoCA.crt"
        - "{{ mongodb_tls_local_dir }}/{{ inventory_hostname }}.pem"
      delegate_to: localhost
      become: no

    - name: "Fail if TLS artifacts are missing on controller"
      fail:
        msg: "Missing local TLS artifact {{ item.stat.path }}. Re-run the playbook without skipping the generation tasks."
      when: not item.stat.exists
      loop: "{{ tls_artifacts.results }}"

    - name: "Create MongoDB TLS directory"
      file:
        path: "{{ mongodb_tls_dir }}"
        state: directory
        owner: mongodb
        group: mongodb
        mode: "0755"

    - name: "Install MongoDB CA certificate"
      copy:
        src: "{{ mongodb_tls_local_dir }}/mongoCA.crt"
        dest: "{{ mongodb_tls_dir }}/mongoCA.crt"
        owner: root
        group: root
        mode: "0644"

    - name: "Install MongoDB node certificate and key PEM"
      copy:
        src: "{{ mongodb_tls_local_dir }}/{{ inventory_hostname }}.pem"
        dest: "{{ mongodb_tls_dir }}/{{ inventory_hostname }}.pem"
        owner: mongodb
        group: mongodb
        mode: "0600"

    - name: "Render MongoDB TLS-enabled config"
      template:
        src: ../../templates/mongod_tls.conf.j2
        dest: /etc/mongod.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart MongoDB

    - name: "Apply MongoDB TLS config restart"
      meta: flush_handlers

    - name: "Wait for MongoDB port after TLS remediation"
      wait_for:
        host: "{{ ansible_host }}"
        port: 27017
        timeout: 60

  handlers:
    - name: Restart MongoDB
      service:
        name: mongod
        state: restarted
