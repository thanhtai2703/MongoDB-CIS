---
# =========================================================================
# CIS MongoDB 8 Remediation — Network Configuration
# Covers: 6.1 (non-default port — change from 27017 to organization-defined)
#
# QUAN TRỌNG: Playbook render lại /etc/mongod.conf bằng templates/mongod.conf.j2
# (plain, KHÔNG có auth/TLS). Phải chạy TRƯỚC remediate_auth/tls, không chạy sau.
# Sau khi chạy, group_vars/all.yaml sẽ được cập nhật mongodb_port mới.
# =========================================================================
- name: "[CIS 6.1] Migrate MongoDB to non-default port"
  hosts: database_nodes
  become: yes
  gather_facts: no
  tags: ["cis_6_1"]
  vars:
    mongodb_port_new: 27018

  tasks:
    - name: "Render mongod.conf with new port"
      template:
        src: ../../templates/mongod.conf.j2
        dest: /etc/mongod.conf
        owner: root
        group: root
        mode: "0644"
      vars:
        mongodb_port: "{{ mongodb_port_new }}"
      notify: "Restart MongoDB"

    - name: "Apply restart immediately"
      meta: flush_handlers

    - name: "Wait for MongoDB to listen on new port"
      wait_for:
        host: "{{ ansible_host }}"
        port: "{{ mongodb_port_new }}"
        timeout: 60

    - name: "Reconfigure replica set members to new port"
      shell: |
        mongosh --port {{ mongodb_port_new }} --quiet --eval '
        var cfg = rs.conf();
        cfg.members.forEach(function(m) {
          m.host = m.host.replace(/:[0-9]+$/, ":{{ mongodb_port_new }}");
        });
        rs.reconfig(cfg, {force: true});
        print("reconfig_done");
        '
      when: inventory_hostname == groups['database_nodes'][0]
      register: reconfig_result
      retries: 12
      delay: 5
      until: reconfig_result.rc == 0 and 'reconfig_done' in reconfig_result.stdout
      changed_when: "'reconfig_done' in reconfig_result.stdout"

    - name: "Wait until primary is writable on new port"
      shell: >
        mongosh --port {{ mongodb_port_new }} --quiet
        --eval "db.hello().isWritablePrimary" | tail -n1
      register: primary_check
      until: primary_check.stdout | trim == 'true'
      retries: 24
      delay: 5
      when: inventory_hostname == groups['database_nodes'][0]
      changed_when: false

    - name: "Persist new port to group_vars/all.yaml on controller"
      lineinfile:
        path: "{{ playbook_dir }}/../../group_vars/all.yaml"
        regexp: '^mongodb_port:'
        line: "mongodb_port: {{ mongodb_port_new }}"
      delegate_to: localhost
      become: no
      run_once: yes

  handlers:
    - name: "Restart MongoDB"
      service:
        name: mongod
        state: restarted


- name: "Update web servers with new MongoDB port"
  hosts: web_servers
  become: yes
  gather_facts: no
  vars:
    mongodb_port_new: 27018
    mongodb_port: "{{ mongodb_port_new }}"
    mongodb_db: "demo"
    php_version: "8.1"

  tasks:
    - name: "Re-render index.php with new port"
      template:
        src: ../../templates/index.php.j2
        dest: /var/www/html/index.php
        owner: www-data
        group: www-data
        mode: "0644"
      notify: "Restart PHP-FPM"

    - name: "Apply PHP-FPM restart"
      meta: flush_handlers

  handlers:
    - name: "Restart PHP-FPM"
      service:
        name: "php{{ php_version }}-fpm"
        state: restarted
